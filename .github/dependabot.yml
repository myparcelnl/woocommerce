version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'build'
      include: 'scope'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 20
    cooldown:
      exclude:
        - 'myparcelnl/*'
    groups:
      minor-php-updates:
        applies-to: version-updates
        exclude-patterns:
          - "myparcelnl/pdk"
        update-types:
          - "minor"
          - "patch"
      php-pdk:
        patterns:
          - 'myparcelnl/pdk'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    commit-message:
      prefix: 'build'
      include: 'scope'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 20
    ignore:
      # Must match the vue that @myparcel-dev/pdk-admin pins for vue-form-builder, or pinia and vue-query get installed
      # twice. Remove when INT-1354 takes the form builder out of the JS PDK.
      - dependency-name: 'vue'
    cooldown:
      exclude:
        - '@myparcel/*'
        - '@myparcel-dev/*'
        - '@myparcel-eslint/*'
        - '@myparcel-pdk/*'
    groups:
      minor-js-updates:
        applies-to: version-updates
        exclude-patterns:
          - "@myparcel-pdk/*"
          - "@myparcel-dev/pdk-*"
        update-types:
          - "minor"
          - "patch"
      js-pdk:
        patterns:
          - '@myparcel-pdk/*'
          - '@myparcel-dev/pdk-*'
