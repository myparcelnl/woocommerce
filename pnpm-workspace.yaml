allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  nx: false
  unrs-resolver: false
  vue-demi: false

autoDedupe: true

lockfile:
  includeResolutionSettings: true

# Same patterns as the cooldown exclude in .github/dependabot.yml, so a new release of our own packages installs at once.
minimumReleaseAgeExclude:
  - '@myparcel/*'
  - '@myparcel-dev/*'
  - '@myparcel-eslint/*'
  - '@myparcel-pdk/*'

overrides:
  '@typescript-eslint/eslint-plugin': ^5.0.0
  '@typescript-eslint/parser': ^5.0.0
  eslint-plugin-prettier: ^4.2.0
  react: ^18
  react-dom: ^18

packages:
  - 'views/**'
